name: Build Easel APK

on:
  push:
    branches: [main, easel-mobile-p0]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            sdkmanager="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
            yes | "$sdkmanager" --licenses >/dev/null || true
            "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest --console=plain --stacktrace

      - name: Assemble perf APK
        run: ./gradlew :app:assemblePerf --console=plain --stacktrace

      - name: Name release APKs
        run: |
          version="$(awk -F'"' '/versionName = /{print $2; exit}' app/build.gradle.kts)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; fi
          for apk in app/build/outputs/apk/perf/*.apk; do
            name="$(basename "$apk")"
            case "$name" in
              *arm64-v8a*) mv "$apk" "app/build/outputs/apk/perf/Easel-${version}-arm64.apk" ;;
              *) mv "$apk" "app/build/outputs/apk/perf/Easel-${version}.apk" ;;
            esac
          done
          ls -lh app/build/outputs/apk/perf/*.apk

      - name: Write checksums
        run: |
          cd app/build/outputs/apk/perf
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: easel-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/perf/*.apk
            app/build/outputs/apk/perf/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach APKs to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: easel-apk-${{ github.sha }}
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
