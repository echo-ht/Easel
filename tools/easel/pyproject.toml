[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "easel-phone-cli"
version = "0.1.0"
description = "Command-line client for Easel's Android task API"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
easel = "easel_cli:main"

[tool.setuptools]
py-modules = ["easel_cli"]
packages = ["easel_desk"]
package-dir = {"" = "scripts"}

[tool.setuptools.package-data]
easel_desk = ["*.html", "*.css", "*.js", "easel-logo.png"]
